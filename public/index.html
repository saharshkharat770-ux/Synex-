<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNEX — One Partner. Every Step. Endless Growth.</title>
<style>
  :root{
    --navy:#0F2A5C;
    --navy-deep:#0A1E42;
    --orange:#F5821F;
    --orange-deep:#E06A0A;
    --cream:#FBF9F5;
    --paper:#FFFFFF;
    --line:#E4E1D8;
    --ink:#1B2436;
    --ink-soft:#5A6478;
    --green:#1E8A5F;
    --amber:#C77A1F;
    --red:#C0432F;
    --purple:#5B4FBF;
    --teal:#0E7C86;
    --radius-sm:6px;
    --radius-md:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    -webkit-font-smoothing:antialiased;
  }
  .sans{font-family:'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif;}
  h1,h2,h3,h4{font-family:'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif; margin:0; letter-spacing:-0.01em;}
  p{line-height:1.6;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  img{display:block;}
  ::selection{background:var(--orange);color:white;}

  /* Layout shell */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(251,249,245,0.96);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1160px;margin:0 auto;padding:12px 28px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand img{height:42px;width:42px;border-radius:10px;box-shadow:0 2px 8px rgba(15,42,92,0.12);}
  .brand-text span:first-child{font-family:'Avenir Next',sans-serif;font-weight:800;font-size:20px;color:var(--navy);letter-spacing:0.02em;line-height:1;}
  .brand-text span:last-child{display:block;font-size:10px;color:var(--orange-deep);font-weight:700;letter-spacing:0.08em;margin-top:2px;}
  .nav-links{display:flex;gap:20px;align-items:center;}
  .nav-links a, .nav-links button.linklike{
    font-family:'Avenir Next',sans-serif;font-size:14px;color:var(--ink-soft);
    background:none;border:none;padding:0;font-weight:600;
  }
  .nav-links a:hover, .nav-links button.linklike:hover{color:var(--navy);}
  .btn{
    font-family:'Avenir Next',sans-serif;font-weight:600;font-size:14px;
    padding:10px 20px;border-radius:999px;border:none;display:inline-flex;align-items:center;gap:8px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--orange);color:white;box-shadow:0 4px 14px rgba(245,130,31,0.28);}
  .btn-primary:hover{background:var(--orange-deep);}
  .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-ghost:hover{background:var(--navy);color:white;}
  .btn-dark{background:var(--navy);color:white;}
  .btn-dark:hover{background:var(--navy-deep);}
  .btn-success{background:var(--green);color:white;}
  .btn-sm{padding:7px 15px;font-size:13px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  .backend-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:#EBF5F0;color:var(--green);border:1px solid #C4E3D3;
    font-family:'Avenir Next',sans-serif;font-size:11.5px;font-weight:600;
    padding:4px 10px;border-radius:999px;
  }
  .backend-badge .pulse{
    width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 2px rgba(30,138,95,0.3);
  }

  main{flex:1;}
  .wrap{max-width:1160px;margin:0 auto;padding:0 28px;}

  /* ---------- HERO ---------- */
  .hero{padding:80px 0 60px;position:relative;overflow:hidden;}
  .hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center;}
  .eyebrow-plain{font-family:'Avenir Next',sans-serif;color:var(--orange-deep);font-weight:700;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:14px;}
  .hero h1{font-family:'Iowan Old Style',Georgia,serif;font-weight:400;font-size:50px;line-height:1.12;color:var(--navy-deep);letter-spacing:-0.01em;}
  .hero h1 em{font-style:italic;color:var(--orange-deep);}
  .hero p.lede{font-size:17.5px;color:var(--ink-soft);margin-top:20px;max-width:500px;line-height:1.65;}
  .hero-ctas{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;}
  .hero-note{font-family:'Avenir Next',sans-serif;font-size:13px;color:var(--ink-soft);margin-top:14px;}

  .phoenix-card{
    background:var(--paper);border:1px solid var(--line);border-radius:18px;
    padding:32px;box-shadow:0 20px 50px rgba(15,42,92,0.08);
    position:relative;text-align:center;
  }
  .phoenix-card .logo-hero{width:160px;height:160px;margin:0 auto 16px;object-fit:contain;}
  .journey-mini{display:flex;flex-direction:column;gap:0;text-align:left;margin-top:12px;}
  .journey-mini .step{display:flex;align-items:center;gap:12px;padding:8px 0;}
  .journey-mini .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex-shrink:0;}
  .journey-mini .step.done .dot{background:var(--green);}
  .journey-mini .step span{font-family:'Avenir Next',sans-serif;font-size:13px;color:var(--ink-soft);font-weight:500;}
  .journey-mini .connector{width:1px;height:12px;background:var(--line);margin-left:4px;}

  .section{padding:60px 0;border-top:1px solid var(--line);}
  .section-head{max-width:640px;margin-bottom:36px;}
  .section-head h2{font-family:'Iowan Old Style',Georgia,serif;font-weight:400;font-size:32px;color:var(--navy-deep);}
  .section-head p{color:var(--ink-soft);margin-top:10px;font-size:15.5px;}

  .problem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .problem-item{padding:20px 0;border-top:2px solid var(--navy);}
  .problem-item h4{font-size:15px;color:var(--navy-deep);margin-bottom:8px;}
  .problem-item p{font-size:13.5px;color:var(--ink-soft);margin:0;}

  .flow-row{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:8px;}
  .flow-card{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;
    min-width:180px;flex:1;
  }
  .flow-card .num{font-family:'Avenir Next',sans-serif;font-weight:800;font-size:12.5px;color:var(--orange-deep);margin-bottom:8px;}
  .flow-card h4{font-size:15px;color:var(--navy-deep);margin-bottom:8px;}
  .flow-card p{font-size:13px;color:var(--ink-soft);margin:0;}
  .flow-arrow{display:flex;align-items:center;justify-content:center;width:34px;color:var(--line);font-size:20px;flex-shrink:0;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}
  .mini-score-demo{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 12px 30px rgba(15,42,92,0.06);}
  .cycle-ring{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .cycle-step{text-align:center;flex:1;}
  .cycle-step .icon{width:44px;height:44px;border-radius:50%;background:var(--navy);color:white;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:'Avenir Next',sans-serif;font-weight:700;font-size:15px;}
  .cycle-step span{font-family:'Avenir Next',sans-serif;font-size:12px;color:var(--ink-soft);font-weight:500;}
  .cycle-arrow{color:var(--line);font-size:16px;}

  .why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .why-card{padding:26px;border-radius:14px;background:var(--paper);border:1px solid var(--line);}
  .why-card h4{font-size:16px;color:var(--navy-deep);margin-bottom:10px;}
  .why-card p{font-size:14px;color:var(--ink-soft);margin:0;}

  .plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .plan-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:30px;display:flex;flex-direction:column;}
  .plan-card.featured{border:2px solid var(--orange);position:relative;box-shadow:0 16px 40px rgba(245,130,31,0.14);}
  .plan-badge{position:absolute;top:-13px;left:28px;background:var(--orange);color:white;font-family:'Avenir Next',sans-serif;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;}
  .plan-card h4{font-size:19px;color:var(--navy-deep);}
  .plan-card .price{font-family:'Avenir Next',sans-serif;font-size:14px;color:var(--ink-soft);margin:10px 0 18px;}
  .plan-card ul{list-style:none;padding:0;margin:0 0 24px;flex:1;}
  .plan-card li{font-size:14px;color:var(--ink-soft);padding:7px 0;border-top:1px solid var(--line);}
  .plan-card li:first-child{border-top:none;}

  .final-cta{
    background:var(--navy-deep);border-radius:22px;padding:60px;text-align:center;
    background-image:radial-gradient(circle at 20% 20%, rgba(245,130,31,0.22), transparent 55%);
  }
  .final-cta h2{color:white;font-family:'Iowan Old Style',Georgia,serif;font-weight:400;font-size:34px;}
  .final-cta p{color:rgba(255,255,255,0.7);margin-top:14px;font-size:16px;}
  .final-cta .hero-ctas{justify-content:center;margin-top:26px;}

  footer{padding:30px 0;border-top:1px solid var(--line);background:var(--paper);}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;font-family:'Avenir Next',sans-serif;font-size:13px;color:var(--ink-soft);}

  /* ---------- AUTH / LOGIN ---------- */
  .auth-shell{max-width:500px;margin:40px auto 80px;padding:0 24px;}
  .auth-card{
    background:var(--paper);border:1px solid var(--line);border-radius:18px;
    padding:36px;box-shadow:0 16px 40px rgba(15,42,92,0.07);
  }
  .auth-tabs{display:flex;gap:4px;background:#EDEAE3;padding:4px;border-radius:10px;margin-bottom:24px;}
  .auth-tab{
    flex:1;text-align:center;padding:10px 8px;border-radius:8px;border:none;background:transparent;
    font-family:'Avenir Next',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    transition:all .15s ease;cursor:pointer;
  }
  .auth-tab.active{background:var(--paper);color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,0.06);}
  .auth-field{margin-bottom:16px;}
  .auth-label{display:block;font-family:'Avenir Next',sans-serif;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .auth-input{
    width:100%;font-family:'Avenir Next',sans-serif;font-size:14.5px;padding:11px 14px;
    border:1.5px solid var(--line);border-radius:8px;background:var(--cream);color:var(--ink);
  }
  .auth-input:focus{outline:none;border-color:var(--orange);background:var(--paper);}
  .demo-accounts{margin-top:24px;border-top:1px dashed var(--line);padding-top:20px;}
  .demo-label{font-family:'Avenir Next',sans-serif;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:10px;}
  .demo-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .demo-pill{
    background:#F0EFE9;border:1px solid #DCD9D0;border-radius:8px;padding:7px 11px;
    font-family:'Avenir Next',sans-serif;font-size:12px;font-weight:600;color:var(--navy);
    cursor:pointer;transition:all .15s ease;
  }
  .demo-pill:hover{background:var(--navy);color:white;border-color:var(--navy);}
  .alert-banner{padding:10px 14px;border-radius:8px;font-family:'Avenir Next',sans-serif;font-size:13px;margin-bottom:16px;}
  .alert-error{background:#FCEBE8;color:var(--red);border:1px solid #F5C6CB;}
  .alert-success{background:#EBF5F0;color:var(--green);border:1px solid #C4E3D3;}

  /* ---------- ASSESSMENT ---------- */
  .assess-shell{max-width:700px;margin:0 auto;padding:50px 28px 80px;}
  .progress-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:10px;}
  .progress-fill{height:100%;background:var(--orange);border-radius:99px;transition:width .35s ease;}
  .progress-label{font-family:'Avenir Next',sans-serif;font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;margin-bottom:34px;}
  .step-title{font-family:'Avenir Next',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.05em;color:var(--orange-deep);margin-bottom:8px;}
  .step-h{font-family:'Iowan Old Style',Georgia,serif;font-weight:400;font-size:27px;color:var(--navy-deep);margin-bottom:30px;}
  .q-block{margin-bottom:28px;}
  .q-text{font-family:'Avenir Next',sans-serif;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
  .opts{display:flex;flex-direction:column;gap:9px;}
  .opt{
    font-family:'Avenir Next',sans-serif;font-size:14.5px;color:var(--ink);
    border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--paper);
    text-align:left;transition:all .12s ease;display:flex;align-items:center;gap:10px;cursor:pointer;
  }
  .opt:hover{border-color:var(--orange);}
  .opt.selected{border-color:var(--orange);background:#FFF6EC;font-weight:600;}
  .opt .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink-soft);flex-shrink:0;position:relative;}
  .opt.selected .radio{border-color:var(--orange);}
  .opt.selected .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--orange);}
  .field-input{
    width:100%;font-family:'Avenir Next',sans-serif;font-size:15px;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);
  }
  .field-input:focus{outline:none;border-color:var(--orange);}
  .step-nav{display:flex;justify-content:space-between;margin-top:40px;}

  /* ---------- APP SHELL & CARDS ---------- */
  .app-shell{max-width:1160px;margin:0 auto;padding:40px 28px 80px;}
  .section-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .section-title-row h2{font-family:'Iowan Old Style',Georgia,serif;font-weight:400;font-size:27px;color:var(--navy-deep);}

  /* Consultant Showcase Banner */
  .consultant-card{
    background:linear-gradient(135deg, #0A1E42 0%, #0F2A5C 60%, #173B7A 100%);
    border-radius:18px;padding:28px 32px;color:white;margin-bottom:32px;
    box-shadow:0 16px 40px rgba(15,42,92,0.18);position:relative;overflow:hidden;
  }
  .consultant-card::after{
    content:'';position:absolute;right:-50px;top:-50px;width:240px;height:240px;
    background:radial-gradient(circle, rgba(245,130,31,0.25) 0%, transparent 70%);border-radius:50%;
  }
  .consultant-flex{display:flex;gap:28px;align-items:center;position:relative;z-index:2;}
  .consultant-avatar{
    width:84px;height:84px;border-radius:50%;border:3px solid var(--orange);
    background:#1E3A70;display:flex;align-items:center;justify-content:center;
    font-family:'Avenir Next',sans-serif;font-size:32px;flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
  .consultant-meta h3{font-size:22px;color:white;margin-bottom:4px;}
  .consultant-meta .role{font-family:'Avenir Next',sans-serif;font-size:13.5px;color:#F5A623;font-weight:700;margin-bottom:6px;}
  .consultant-meta p{font-size:13px;color:rgba(255,255,255,0.78);margin:0 0 10px;line-height:1.45;}
  .consultant-badges{display:flex;gap:12px;flex-wrap:wrap;}
  .c-pill{
    background:rgba(255,255,255,0.12);padding:5px 12px;border-radius:999px;
    font-family:'Avenir Next',sans-serif;font-size:12px;color:white;display:inline-flex;align-items:center;gap:6px;
  }
  .consultant-actions{margin-left:auto;display:flex;flex-direction:column;gap:10px;flex-shrink:0;position:relative;z-index:2;}

  /* KPI Grid */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:32px;}
  .kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .kpi-card .lbl{font-family:'Avenir Next',sans-serif;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .kpi-card .val{font-family:'Avenir Next',sans-serif;font-weight:800;font-size:26px;color:var(--navy-deep);line-height:1.1;}
  .kpi-card .sub{font-family:'Avenir Next',sans-serif;font-size:12px;margin-top:6px;font-weight:500;}

  /* Business Intelligence Analytics Panel */
  .bi-grid{display:grid;grid-template-columns:1.2fr 0.8fr;gap:24px;margin-bottom:32px;}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:24px;}
  .panel h3{font-size:17px;color:var(--navy-deep);margin-bottom:18px;display:flex;align-items:center;gap:8px;}

  /* Industry Benchmark Comparison Bars */
  .bench-row{margin-bottom:16px;}
  .bench-labels{display:flex;justify-content:space-between;font-family:'Avenir Next',sans-serif;font-size:13px;margin-bottom:6px;}
  .bench-bars{position:relative;height:12px;background:#EDEAE3;border-radius:99px;overflow:hidden;}
  .bench-bar-client{height:100%;border-radius:99px;position:relative;z-index:2;}
  .bench-target-line{
    position:absolute;top:0;bottom:0;width:3px;background:var(--ink);z-index:3;
    transform:translateX(-50%);
  }
  .bench-delta{font-family:'Avenir Next',sans-serif;font-weight:700;font-size:11.5px;}

  /* SWOT Matrix */
  .swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .swot-box{border-radius:10px;padding:16px;}
  .swot-s{background:#E4F5EC;border-left:4px solid var(--green);}
  .swot-w{background:#FCEBE8;border-left:4px solid var(--red);}
  .swot-o{background:#EBF3FA;border-left:4px solid #1E70BF;}
  .swot-t{background:#FFF3DE;border-left:4px solid var(--amber);}
  .swot-box h5{font-family:'Avenir Next',sans-serif;font-size:13px;font-weight:700;margin:0 0 6px;}
  .swot-box ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink);line-height:1.45;}

  /* Score dial */
  .score-hero{display:grid;grid-template-columns:260px 1fr;gap:40px;align-items:center;margin-bottom:44px;}
  .score-dial{position:relative;width:230px;height:230px;margin:0 auto;}
  .score-dial svg{transform:rotate(-90deg);}
  .score-dial .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .score-dial .num .n{font-family:'Avenir Next',sans-serif;font-weight:800;font-size:48px;color:var(--navy-deep);line-height:1;}
  .score-dial .num .lbl{font-family:'Avenir Next',sans-serif;font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .health-tag{display:inline-block;font-family:'Avenir Next',sans-serif;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;margin-bottom:12px;}
  .health-strong{background:#E4F5EC;color:var(--green);}
  .health-good{background:#FFF3DE;color:var(--amber);}
  .health-weak{background:#FBE7E2;color:var(--red);}

  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:36px;}
  .cat-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;}
  .cat-card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .cat-card h4{font-size:13px;color:var(--ink);font-weight:600;}
  .cat-card .score{font-family:'Avenir Next',sans-serif;font-weight:800;font-size:18px;color:var(--navy-deep);}
  .bar-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;}

  .opp-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;}
  .opp-card .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .opp-card h4{font-size:16px;color:var(--navy-deep);}
  .opp-tags{display:flex;gap:8px;flex-shrink:0;}
  .tag{font-family:'Avenir Next',sans-serif;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .tag-impact-high{background:#FBE7E2;color:var(--red);}
  .tag-impact-medium{background:#FFF3DE;color:var(--amber);}
  .tag-effort{background:#EDEFF6;color:var(--navy);}
  .opp-card .problem{font-size:14px;color:var(--ink-soft);margin-bottom:12px;}
  .opp-card ol{margin:0;padding-left:20px;}
  .opp-card li{font-size:13.5px;color:var(--ink);padding:3px 0;}

  /* Monthly Growth Cycle */
  .cycle-track{display:flex;align-items:center;justify-content:space-between;margin:16px 0;}
  .cycle-track .cs{flex:1;text-align:center;position:relative;}
  .cycle-track .cs .dot2{
    width:38px;height:38px;border-radius:50%;background:var(--navy);color:white;

/* ============ API WRAPPER ============ */
async function api(path, method = 'GET', body = null){
  const headers = { 'Content-Type': 'application/json' };
  if(state.token){
    headers['Authorization'] = `Bearer ${state.token}`;
  }
  try{
    const res = await fetch(path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : null,
    });
    const data = await res.json();
    return { status: res.status, ok: res.ok, data };
  } catch(err){
    console.error('API Error:', err);
    return { status: 0, ok: false, data: { success: false, message: 'Server communication error' } };
  }
}

function nav(route){
  state.route = route;

  state.authSuccess = '';

  if(route === 'consultant'){

  }
  render();
}

async function checkAuthSession(){
  if(!state.token) return;
  const res = await api('/api/auth/me');
  if(res.ok && res.data.user){
    state.user = res.data.user;
    if(res.data.business){
      state.business = res.data.business;
      await loadBusinessFullDetails(res.data.business.id);
    }
  } else {
    state.token = null;
    localStorage.removeItem('synex_token');
  }
  render();
}

async function loadBusinessFullDetails(bizId){
  const res = await api(`/api/businesses/${bizId}`);
  if(res.ok){
    state.business = res.data.business;
    if(res.data.consultant){
      state.consultant = res.data.consultant;
    }
    if(res.data.assessment){
      state.overall = res.data.assessment.overall_score;
      state.catScores = res.data.assessment.category_scores;
    }
    if(res.data.blueprint){
      state.blueprint = {
        priorities: res.data.blueprint.priorities,
        strongest: [],
        weakest: [],
      };
      state.blueprintPhase = res.data.blueprint.roadmap_phase || 1;
    }
    if(res.data.tasks){
      const taskMap = {};
      res.data.tasks.forEach(t=>{ taskMap[t.task_key] = t.is_completed === 1; });
      state.onboardingTasks = taskMap;
    }
    if(res.data.cycle){
      state.cyclePhase = res.data.cycle.cycle_stage;
    }
    if(res.data.analytics){
      state.analytics = res.data.analytics;
    }
    render();
  }
}

async function quickLogin(email, password){
  const eInput = document.getElementById('auth_email');
  const pInput = document.getElementById('auth_password');
  if(eInput && pInput){
    eInput.value = email;
    pInput.value = password;
  }
  executeLogin(email, password);
}

async function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById('auth_email').value;
  const password = document.getElementById('auth_password').value;

  if(state.authMode === 'login'){
    executeLogin(email, password);
  } else {
    const name = document.getElementById('auth_name').value;
    const businessName = document.getElementById('auth_biz_name').value;
    const businessType = document.getElementById('auth_biz_type').value;

    const res = await api('/api/auth/register', 'POST', {
      name,
      email,
      password,
      businessName,
      businessType,
      yearsOperating: '1–3 years',
    });

    if(res.ok){
      state.token = res.data.token;
      state.user = res.data.user;
      state.business = res.data.business;
      localStorage.setItem('synex_token', res.data.token);
      state.authSuccess = 'Account created successfully! Loading...';
      render();
      setTimeout(()=>{ nav('discovery'); }, 500);
    } else {
      state.authError = res.data.message || 'Registration failed.';
      render();
    }
  }
}

async function executeLogin(email, password){
  state.authError = '';
  const res = await api('/api/auth/login', 'POST', { email, password });
  if(res.ok){
    state.token = res.data.token;
    state.user = res.data.user;
    localStorage.setItem('synex_token', res.data.token);

    if(res.data.business){
      state.business = res.data.business;
      await loadBusinessFullDetails(res.data.business.id);
      nav('dashboard');
    } else if(res.data.user.role === 'consultant'){
      nav('consultant');
    } else {
      nav('discovery');
    }
  } else {
    state.authError = res.data.message || 'Invalid credentials.';
    render();
  }
}

function Assessment(){
  const section = ASSESSMENT[state.stepIndex];
  const total = ASSESSMENT.length;
  const pct = Math.round(((state.stepIndex)/total)*100);
  const allAnswered = section.questions.every(q=>state.answers[q.id]!=null);

  return `
  <div class="assess-shell">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label"><span>Step ${state.stepIndex+1} of ${total}</span><span>${pct}% complete</span></div>
    <div class="step-title">BUSINESS HEALTH CHECK</div>
    <div class="step-h">${section.title}</div>
    ${section.questions.map(q=>{
      if(q.type==='choice'){
        return `<div class="q-block">
          <div class="q-text">${q.text}</div>
          <div class="opts">
            ${q.opts.map(o=>`
              <button class="opt ${state.answers[q.id]===o.v?'selected':''}" onclick="setAnswer('${q.id}',${o.v})">
                <span class="radio"></span>${o.label}
              </button>`).join('')}
          </div>
        </div>`;
      } else {
        const val = state.answers[q.id];
        return `<div class="q-block">
          <div class="q-text">${q.text}</div>
          <div class="opts" style="flex-direction:row;gap:8px;">
            ${[1,2,3,4,5].map(n=>`
              <button class="opt ${val===n?'selected':''}" style="flex:1;justify-content:center;padding:12px 0;" onclick="setAnswer('${q.id}',${n})">${n}</button>
            `).join('')}
          </div>
          <div style="display:flex;justify-content:space-between;font-family:'Avenir Next',sans-serif;font-size:11.5px;color:var(--ink-soft);margin-top:6px;"><span>1 (Lagging)</span><span>5 (Industry Best)</span></div>
        </div>`;
      }
    }).join('')}
    <div class="step-nav">
      <button class="btn btn-ghost" onclick="prevStep()">${state.stepIndex===0?'Back':'Previous'}</button>
      <button class="btn btn-primary" ${!allAnswered?'disabled':''} onclick="nextStep()">${state.stepIndex===total-1?'Submit & See Full Analysis →':'Next'}</button>
    </div>
  </div>`;
}

function setAnswer(id,v){ state.answers[id]=v; render(); }
function prevStep(){ if(state.stepIndex===0){nav('discovery');return;} state.stepIndex--; window.scrollTo(0,0); render(); }

async function nextStep(){
  if(state.stepIndex === ASSESSMENT.length - 1){
    const payload = {
      businessId: state.business.id || null,
      businessData: {
        name: state.business.name || 'My Business',
        owner: state.business.owner || state.business.owner_name || 'Business Owner',
        type: state.business.type || state.business.business_type || 'Retail Store',
        years: state.business.years || state.business.years_operating || '1–3 years',
      },
      answers: state.answers,
    };

    const res = await api('/api/assessments', 'POST', payload);
    if(res.ok && res.data){
      state.business.id = res.data.businessId;
      state.overall = res.data.overall;
      state.catScores = res.data.catScores;
      state.blueprint = res.data.blueprint;
      state.analytics = res.data.analytics;
    }
    nav('score');
    return;
  }
  state.stepIndex++;
  window.scrollTo(0,0);
  render();
}

/* ============ BLUEPRINT ============ */
function Blueprint(){

  return `
  <div class="app-shell">
    <div class="section-title-row">
      <h2>Your Personalized Growth Blueprint</h2>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost btn-sm" onclick="nav('dashboard')">Open Dashboard →</button>
      </div>
    </div>

    ${ConsultantBanner()}

    <p style="color:var(--ink-soft);max-width:680px;margin-bottom:28px;">
      Tailored 90-day transformation plan for <strong>${state.business.name||'your business'}</strong> based on your SYNEX health check score (<strong>${state.overall || 67}/100</strong>).
    </p>

    <div class="panel">
      <h3>Recommended Priorities</h3>
      ${bp.priorities.map((p,i)=>`
        <div class="opp-card" style="margin-bottom:${i===bp.priorities.length-1?'0':'16px'}">
          <div class="head">

              <span class="tag tag-impact-${(p.impact||'high').toLowerCase()}">Impact: ${p.impact||'High'}</span>
              <span class="tag tag-effort">Effort: ${p.effort||'Medium'}</span>
            </div>
          </div>
          <div class="problem"><strong>Problem:</strong> ${p.problem}</div>
          <div style="font-family:'Avenir Next',sans-serif;font-size:13px;font-weight:700;color:var(--navy-deep);margin-bottom:6px;">Recommended Actions</div>
          <ol>${(p.actions||[]).map(a=>`<li>${a}</li>`).join('')}</ol>
        </div>`).join('')}
    </div>

    <div class="section-title-row"><h2>90-Day Growth Roadmap Phases</h2></div>
    <div class="phase-tabs">
      <button class="phase-tab ${phase===1?'active':''}" onclick="setRoadmapPhase(1)">Phase 1 — Foundation (Days 1–30)</button>
      <button class="phase-tab ${phase===2?'active':''}" onclick="setRoadmapPhase(2)">Phase 2 — Strategy (Days 31–60)</button>
      <button class="phase-tab ${phase===3?'active':''}" onclick="setRoadmapPhase(3)">Phase 3 — Scale (Days 61–90)</button>

      <div style="font-family:'Avenir Next',sans-serif;font-weight:700;font-size:13px;color:var(--orange-deep);margin-bottom:4px;">${phaseContent[phase].range}</div>
      <h3>${phaseContent[phase].name}</h3>
      <ul style="list-style:none;padding:0;margin-top:14px;">
        ${phaseContent[phase].items.map(item=>`<li style="font-size:14.5px;color:var(--ink);padding:10px 0;border-top:1px solid var(--line);">✓ ${item}</li>`).join('')}
      </ul>
    </div>

    <div class="cta-banner">
      <div>
        <h3>Ready to execute your onboarding?</h3>
        <p>Begin guided task execution and track your live progress.</p>

      <button class="btn btn-primary" onclick="nav('onboarding')">Start 30-Day Onboarding</button>

async function setRoadmapPhase(p){
  state.blueprintPhase = p;
  render();
  if(state.business.id){
    await api(`/api/sync/${state.business.id}/roadmap-phase`, 'PATCH', { phase: p });
  }
}

/* ============ ONBOARDING ============ */
function Onboarding(){
  const done = Object.values(state.onboardingTasks).filter(Boolean).length;
  const pct = Math.round((done/ONBOARD_TASKS.length)*100);
  const groups = [...new Set(ONBOARD_TASKS.map(t=>t.day))];

  return `
  <div class="app-shell">
    <div class="section-title-row">
      <h2>Your SYNEX Guided Onboarding</h2>
      <div class="backend-badge"><span class="pulse"></span> Synced with SQLite</div>
    </div>

    ${ConsultantBanner()}

    <p style="color:var(--ink-soft);margin-bottom:8px;">First 30 days after partnering with SYNEX — Foundation, Strategy, and Implementation sprints.</p>
    <div class="progress-big"><div class="fill" style="width:${pct}%"></div></div>
    <div class="sans" style="font-size:13.5px;color:var(--ink-soft);margin-bottom:30px;">
      <strong>${pct}% Complete</strong> (${done} of ${ONBOARD_TASKS.length} tasks finished)
    </div>

    ${groups.map(g=>`
      <div class="day-block">
        <div class="range">${g.split(' · ')[0]}</div>
        <h4>${g.split(' · ')[1]}</h4>
        <div class="panel" style="padding:10px 22px;">
          ${ONBOARD_TASKS.filter(t=>t.day===g).map(t=>`
            <div class="task-row ${state.onboardingTasks[t.id]?'done':''}">
              <div class="checkbox ${state.onboardingTasks[t.id]?'checked':''}" onclick="toggleTask('${t.id}')">
                ${state.onboardingTasks[t.id]?'✓':''}
              </div>
              <span onclick="toggleTask('${t.id}')" style="cursor:pointer;">${t.text}</span>
            </div>`).join('')}
        </div>
      </div>`).join('')}

    <div class="cta-banner">
      <div><h3>Go to your dashboard</h3><p>Track your score, roadmap and progress in one place.</p></div>
      <button class="btn btn-primary" onclick="nav('dashboard')">Open Client Dashboard</button>
    </div>
  </div>`;
}

async function toggleTask(id){
  const nextVal = !state.onboardingTasks[id];
  state.onboardingTasks[id] = nextVal;
  render();

  if(state.business.id){
    await api(`/api/sync/${state.business.id}/onboarding`, 'PATCH', {
      taskKey: id,
      isCompleted: nextVal,
    });
  }
}

  return `
  <div class="app-shell">
    <div class="dash-top">

      </div>
      <div class="kpi-card">
        <div class="lbl">Onboarding Progress</div>
        <div class="val">${pct}%</div>
        <div class="sub" style="color:var(--ink-soft)">${done} of ${ONBOARD_TASKS.length} tasks</div>
      </div>
      <div class="kpi-card">
        <div class="lbl">Active Priorities</div>
        <div class="val">${bp.priorities.length}</div>
        <div class="sub" style="color:var(--ink-soft)">In execution</div>
      </div>
      <div class="kpi-card">
        <div class="lbl">Membership Plan</div>
        <div class="val" style="font-size:20px;color:var(--navy);">${plan}</div>
        <div class="sub" style="color:var(--green)">✓ Continuous Partnership</div>
      </div>
    </div>

    <!-- Deep Analytics Section -->
    ${DeepAnalyticsSection(ana, cats)}

      <div>
        <div class="panel">
          <h3>Category Health Breakdown</h3>
          ${Object.entries(cats).map(([k,v])=>`
            <div style="margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;font-family:'Avenir Next',sans-serif;font-size:13px;color:var(--ink-soft);margin-bottom:5px;">
                <span>${CATEGORY_META[k]? CATEGORY_META[k].icon + ' ' + CATEGORY_META[k].label : k}</span>
                <span style="font-weight:700;color:${scoreColor(v)}">${v}%</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${v}%;background:${scoreColor(v)}"></div></div>
            </div>`).join('')}
        </div>
        <div class="panel">
          <h3>Top Transformation Priorities</h3>
          ${bp.priorities.map((p,i)=>`
            <div class="task-row">
              <span style="font-family:'Avenir Next',sans-serif;font-weight:700;color:var(--orange-deep);">${i+1}</span>
              <span>Improve ${CATEGORY_META[p.key]? CATEGORY_META[p.key].label : p.key}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div>
        <div class="panel">
          <h3>Monthly Growth Cycle</h3>
          <div class="cycle-track">
            ${['Collect','Analyze','Report','Strategy','Execute'].map((s,i)=>`
              <div class="cs ${i===cyclePhase?'active':''}" onclick="setCycleStage(${i})">

        </div>

async function setCycleStage(stage){
  state.cyclePhase = stage;
  render();
  if(state.business.id){
    await api(`/api/sync/${state.business.id}/cycle`, 'PATCH', { cycleStage: stage });
  }
}

async function advanceCycle(){
  const nextStage = ((state.cyclePhase || 0) + 1) % 5;
  setCycleStage(nextStage);
}

/* ============ CONSULTANT / ADMIN PORTFOLIO VIEW ============ */

  return `

      </div>
      <div class="kpi-card">
        <div class="lbl">Transformation Impact</div>
        <div class="val" style="color:var(--green);">₹42.5 Lakhs</div>
        <div class="sub" style="color:var(--ink-soft)">Annual Leakage Recovered</div>

    <!-- Filter Pills -->
    <div class="filter-pills">

      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Business &amp; Owner</th>
            <th>Industry Type</th>

            <th>Health Status</th>
            <th>Top Priority</th>

                <div style="font-size:12px;color:var(--ink-soft);">${r.owner || '—'} · ${r.email || ''}</div>

                <span class="score-pill" style="background:${r.health==='Strong'?'#E4F5EC':r.health==='Good'?'#FFF3DE':'#FBE7E2'};color:${r.health==='Strong'?'var(--green)':r.health==='Good'?'var(--amber)':'var(--red)'}">

                  View Full BI &amp; Blueprint →

        </tbody>

    </div>

async function viewClientDetail(bizId){
  await loadBusinessFullDetails(bizId);
  nav('dashboard');
}

/* ============ MAIN RENDERER ============ */
function render(){
  const app = document.getElementById('app');
  let body = '';
  switch(state.route){
    case 'landing': body = Landing(); break;
    case 'login':
    case 'register': body = AuthPage(); break;
    case 'discovery': body = Discovery(); break;
    case 'assessment': body = Assessment(); break;
    case 'score': body = ScorePage(); break;
    case 'blueprint': body = Blueprint(); break;
    case 'onboarding': body = Onboarding(); break;
    case 'dashboard': body = Dashboard(); break;
    case 'consultant': body = Consultant(); break;
    default: body = Landing();
  }
  app.innerHTML = `${Topbar()}<main>${body}</main>`;
}

window.setCycleStage = setCycleStage;
window.loadConsultantData = loadConsultantData;
window.viewClientDetail = viewClientDetail;
window.quickLogin = quickLogin;
window.handleAuthSubmit = handleAuthSubmit;
window.logout = logout;
window.checkDiscoveryValid = checkDiscoveryValid;

// Initialize
checkAuthSession();
render();
</script>
